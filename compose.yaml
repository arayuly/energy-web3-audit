services:
  postgres:
    image: postgres:16-alpine
    container_name: energy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_energy_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: energy_mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT}:1883"
    volumes:
      - ./infra/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  ipfs:
    image: ipfs/kubo:latest
    container_name: energy_ipfs
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "${IPFS_API_PORT}:5001"
      - "${IPFS_GATEWAY_PORT}:8080"
    volumes:
      - ipfs_staging:/export
      - ipfs_data:/data/ipfs

  backend:
    build: ./backend
    container_name: energy_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      ipfs:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      IPFS_HOST: ipfs
      IPFS_API_PORT: 5001
      ETH_RPC_URL: http://host.docker.internal:8545
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./contracts:/app/contracts:ro
      - ./iot-simulator:/app/iot-simulator:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pg_energy_data:
  mosquitto_data:
  mosquitto_log:
  ipfs_staging:
  ipfs_data: